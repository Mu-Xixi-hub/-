server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: jdbc:h2:file:./data/login-db
    username: sa
    password: ${H2_PASSWORD:local-demo-only}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false
