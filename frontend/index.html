<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的账户</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232452dd'/%3E%3Ccircle cx='16' cy='12' r='5' fill='white'/%3E%3Cpath d='M7 27a9 9 0 0 1 18 0' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
  <header><span class="logo">U</span><strong>我的账户</strong></header>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="eyebrow">ACCOUNT</div>
      <h1 id="title">欢迎登录</h1>
      <p id="subtitle" class="muted">登录后查看你的个人信息。</p>
      <p id="message" role="status" aria-live="polite">正在检查登录状态…</p>
      <form id="login-form" hidden>
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required maxlength="50" placeholder="输入用户名">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="100" placeholder="输入密码">
        <button id="login-button" type="submit">登录</button>
        <aside>测试账号：<code>zhangsan</code> / <code>lisi</code><br>统一密码：<code>Demo123!</code></aside>
      </form>
      <div id="profile" hidden>
        <div class="identity"><span id="avatar" class="avatar"></span><div><strong id="nickname"></strong><p class="muted">已登录</p></div></div>
        <dl>
          <div><dt>用户 ID</dt><dd id="user-id"></dd></div>
          <div><dt>用户名</dt><dd id="user-name"></dd></div>
          <div><dt>邮箱</dt><dd id="email"></dd></div>
          <div><dt>部门</dt><dd id="department"></dd></div>
        </dl>
        <button id="refresh-button" class="secondary" type="button">刷新个人信息</button>
        <button id="logout-button" class="text-button" type="button">退出登录</button>
      </div>
    </section>
  </main>
  <footer>个人账户 · 本地演示</footer>
</body>
</html>
